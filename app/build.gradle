plugins {
    id 'com.android.application'
}

android {
    namespace 'com.idrees.emberhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.idrees.emberhome'
        minSdk 19
        targetSdk 34
        versionCode 3
        versionName '1.1'
        manifestPlaceholders = [appLabel: 'Ember Home']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug {
            applicationIdSuffix '.msd338'
            versionNameSuffix '-msd338'
            manifestPlaceholders = [appLabel: 'Ember Home MSD338 Edition']
        }
        release { minifyEnabled false }
    }
}
