plugins {
    id 'com.android.application'
}

android {
    namespace 'com.idrees.emberhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.idrees.emberhome'
        minSdk 19
        targetSdk 28
        versionCode 4
        versionName '1.2-thiago-kitkat'
        manifestPlaceholders = [appLabel: 'EmberHome KitKat Edition']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug {
            applicationIdSuffix '.msd338'
            versionNameSuffix '-msd338'
            manifestPlaceholders = [appLabel: 'EmberHome KitKat Edition']
        }
        release { minifyEnabled false }
    }
}
