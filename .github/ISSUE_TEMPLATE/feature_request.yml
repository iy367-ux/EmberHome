name: Feature request
description: Suggest an improvement to EmberHome
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Please focus on one feature per request. Future active development targets Android 6.0 (API 23) and newer."
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the user need or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like EmberHome to do?
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Relevant devices and Android versions
      description: Mention any TV or streaming devices this feature should support.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
    validations:
      required: false
