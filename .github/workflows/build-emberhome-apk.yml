name: Build EmberHome APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'EmberHome.zip'
      - '.github/workflows/build-emberhome-apk.yml'

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract ready-to-build project
        run: |
          mkdir -p app-source
          unzip -q EmberHome.zip -d app-source
          echo "Archive contents:"
          find app-source -maxdepth 4 -type f | sort | head -250
          echo "Gradle project files:"
          find app-source -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name gradlew \) -print
      - name: Locate Android Gradle project
        id: locate
        run: |
          SETTINGS="$(find app-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found in EmberHome.zip. Check the archive contents above."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $PROJECT_DIR"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmberHome-debug-APK
          path: |
            ${{ steps.locate.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
