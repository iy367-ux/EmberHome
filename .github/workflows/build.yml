name: Build APK

on:
  push:
    branches: [main, emberhome-update-2]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EmberHome APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare active v2.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="EmberHome(2).zip"
          test -f "$ZIP" || { echo "::error::Source archive not found: $ZIP"; exit 1; }

          BUILD_DIR="$RUNNER_TEMP/emberhome-source"
          mkdir -p "$BUILD_DIR"
          unzip -q "$ZIP" -d "$BUILD_DIR"

          PROJECT_DIR="$(find "$BUILD_DIR" -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::The source archive must contain a Gradle project with settings.gradle and app/."
            exit 1
          fi

          echo "EMBERHOME_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using source project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Assemble debug APK
        run: gradle -p "$EMBERHOME_PROJECT_DIR" assembleDebug --no-daemon

      - name: Stage APK
        run: cp "$EMBERHOME_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" EmberHome.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmberHome-update-2-apk
          path: EmberHome.apk
          if-no-files-found: error

      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EmberHome.apk
