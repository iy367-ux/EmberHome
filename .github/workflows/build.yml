name: Build APK
on:
  push:
    branches: [main, icon-sharpness-fix]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and use uploaded v2.0.0 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="EmberHome(1).zip"
          if [ -f "$ZIP" ]; then
            echo "=== ZIP contents ==="
            unzip -l "$ZIP" | sed -n '1,100p'
            mkdir -p /tmp/emberhome-v2
            unzip -q "$ZIP" -d /tmp/emberhome-v2
            ROOT="$(find /tmp/emberhome-v2 -type f -name settings.gradle -print -quit | xargs -r dirname)"
            if [ -n "$ROOT" ] && [ -d "$ROOT/app" ]; then
              echo "Using Android project from ZIP: $ROOT"
              rsync -a --delete --exclude='.git' --exclude='.github' "$ROOT"/ "$GITHUB_WORKSPACE"/
              echo "=== ZIP SOURCE: HomeView.java icon-related code ==="
              grep -nE 'loadIcon|setImageDrawable|ImageView|setScaleType|icon' app/src/main/java/com/emberhome/launcher/HomeView.java | head -100
              echo "=== ZIP SOURCE: AppRepo.java ==="
              sed -n '1,240p' app/src/main/java/com/emberhome/launcher/AppRepo.java
              echo "=== ZIP SOURCE: AppEntry.java ==="
              cat app/src/main/java/com/emberhome/launcher/AppEntry.java
              echo "=== ZIP SOURCE: HomeView.java first 300 lines ==="
              sed -n '1,300p' app/src/main/java/com/emberhome/launcher/HomeView.java
            else
              echo "::warning::ZIP does not contain a complete Gradle Android project (settings.gradle + app/). Building checked-in project instead."
            fi
          else
            echo "::error::Expected EmberHome(1).zip was not found."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk EmberHome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EmberHome-v2.0.0-apk
          path: EmberHome.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: EmberHome.apk
