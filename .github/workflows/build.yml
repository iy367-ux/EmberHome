name: Build and test EmberHome Thiago-style KitKat port
on:
  push:
    branches: [thiago-kitkat-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Compile debug APK
        run: gradle assembleDebug --no-daemon
      - name: Preserve APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EmberHome-Thiago-KitKat.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmberHome-Thiago-KitKat-APK
          path: EmberHome-Thiago-KitKat.apk
      - name: Boot Android 4.4 emulator and test launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 19
          target: default
          arch: x86
          profile: Nexus 7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb install EmberHome-Thiago-KitKat.apk
            adb shell am start -n com.idrees.emberhome.msd338/com.idrees.emberhome.ThiagoActivity
            sleep 6
            adb shell dumpsys activity activities | grep -q 'com.idrees.emberhome.ThiagoActivity'
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/01-home.png
            adb shell input keyevent 20
            sleep 2
            adb exec-out screencap -p > screenshots/02-all-apps.png
            adb shell input keyevent 82
            sleep 2
            adb exec-out screencap -p > screenshots/03-context-menu.png
            adb shell input keyevent 4
            adb shell input keyevent 4
            adb shell input keyevent 19
            adb shell input keyevent 19
            adb shell input keyevent 22
            adb shell input keyevent 22
            adb shell input keyevent 20
            sleep 2
            adb exec-out screencap -p > screenshots/04-settings.png
            adb shell input keyevent 4
            adb shell input keyevent 19
            adb shell input keyevent 19
            adb shell input keyevent 22
            adb shell input keyevent 22
            adb shell input keyevent 22
            sleep 2
            adb exec-out screencap -p > screenshots/05-control-centre.png
            if adb logcat -d | grep -qE 'FATAL EXCEPTION|AndroidRuntime'; then exit 1; fi
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmberHome-Thiago-KitKat-Screenshots
          path: screenshots/*.png
          if-no-files-found: warn
