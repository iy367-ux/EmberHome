<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    
    <linearGradient id="burnishedCopper" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E2A078" />
      <stop offset="45%" stop-color="#C47A50" />
      <stop offset="100%" stop-color="#8C5130" />
    </linearGradient>

    
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#07090D" flood-opacity="0.85" />
    </filter>

    
    <path id="leftEPath" d="
      M 412,332
      L 568,262
      L 568,382
      L 520,382
      L 520,414
      L 568,414
      L 568,446
      L 520,446
      L 520,478
      L 568,478
      L 568,544
      L 412,544
      Z
    " />

    
    <mask id="knockoutRightShape" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080">
      <rect width="1080" height="1080" fill="white" />
      <use href="#leftEPath" fill="none" stroke="black" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10" />
    </mask>
  </defs>

  
  <rect width="1080" height="1080" fill="#11151D" />

  
  <g filter="url(#iconShadow)">
    <rect x="270" y="160" width="540" height="540" rx="135" fill="#354353" />
    <rect x="272" y="162" width="536" height="536" rx="133" fill="none" stroke="#47586B" stroke-width="3" />
  </g>

  
  <g fill="none" stroke="url(#burnishedCopper)" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10">
    
    <path d="
      M 476,342
      L 668,366
      L 668,576
      L 476,576
      Z
    " stroke-width="14" mask="url(#knockoutRightShape)" />

    
    <use href="#leftEPath" stroke-width="14" />
  </g>

  
  <text x="540" y="810" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="8" fill="url(#burnishedCopper)" text-anchor="middle">
    EMBERHOME
  </text>

  
  <text x="540" y="868" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="12" fill="#5C7087" text-anchor="middle">
    LAUNCHER
