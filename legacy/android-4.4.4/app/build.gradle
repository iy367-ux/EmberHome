plugins {
    id 'com.android.application'
}

android {
    namespace 'com.idrees.emberhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.idrees.emberhome'
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
